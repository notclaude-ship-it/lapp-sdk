[package]
name = "lapp-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK pour écrire des applications .lapp : fenêtre, rendu GPU/CPU, tactile, texte, stockage"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = "0.4"
tiny-skia = "0.11"
ab_glyph = "0.2"
glutin = { version = "0.32", default-features = false, features = ["egl", "x11"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "x11"] }
glow = "0.16"
x11rb = "0.13"

[workspace]